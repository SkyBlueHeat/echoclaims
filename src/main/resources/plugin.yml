name: EchoClaims
version: '${version}'
main: io.github.skyblueheat.echoclaims.paper.EchoClaimsPlugin
description: Resolve lost-item claims with server evidence instead of screenshots.
authors: [SkyBlueHeat]
api-version: '26.2'
load: POSTWORLD
commands:
  echoclaims:
    description: EchoClaims administration and claim command
    usage: /echoclaims <status|incidents|incident|snapshot|claim|review>
    aliases: [ec]
    permission: echoclaims.command.status
permissions:
  echoclaims.admin:
    description: Allows full administration and diagnostics for EchoClaims
    default: op
  echoclaims.command.status:
    description: Allows checking EchoClaims status
    default: op
  echoclaims.command.incidents:
    description: Allows listing recent incidents for a player
    default: op
  echoclaims.command.incident:
    description: Allows looking up a single incident by UUID
    default: op
  echoclaims.command.snapshot:
    description: Allows looking up an inventory snapshot by UUID
    default: op
  echoclaims.command.claim.list:
    description: Allows listing own claims
    default: true
  echoclaims.command.claim.view:
    description: Allows viewing own claim details
    default: true
  echoclaims.command.claim.create:
    description: Allows creating a claim
    default: true
  echoclaims.command.claim.cancel:
    description: Allows cancelling own claims
    default: true
  echoclaims.command.claim.submit:
    description: Allows submitting own claims
    default: true
  echoclaims.command.claim.staff.view:
    description: Allows staff to view any claim details
    default: op
  echoclaims.command.claim.staff.list:
    description: Allows staff to list claims for any player
    default: op
  echoclaims.staff.review.queue:
    description: Allows viewing the staff review queue
    default: op
  echoclaims.staff.review.view:
    description: Allows viewing a claim review
    default: op
  echoclaims.staff.review.start:
    description: Allows starting a review and taking ownership
    default: op
  echoclaims.staff.review.takeover:
    description: Allows taking over an assigned review
    default: op
  echoclaims.staff.review.evidence:
    description: Allows viewing evidence for a review
    default: op
  echoclaims.staff.review.note:
    description: Allows adding internal staff notes
    default: op
  echoclaims.staff.review.request-info:
    description: Allows requesting information from the claimant
    default: op
  echoclaims.staff.review.item-decision:
    description: Allows creating and updating item-level decisions
    default: op
  echoclaims.staff.review.approve:
    description: Allows approving a review
    default: op
  echoclaims.staff.review.partial:
    description: Allows partially approving a review
    default: op
  echoclaims.staff.review.reject:
    description: Allows rejecting a review
    default: op
  echoclaims.staff.review.history:
    description: Allows viewing review history and audit trail
    default: op
  echoclaims.claim.respond:
    description: Allows responding to a staff information request
    default: true
