# EchoClaims English messages. MiniMessage formatting is supported.
# Placeholders are written as {name} and are sanitized before substitution.

prefix: "<gray>[<aqua>EchoClaims</aqua>]</gray> "

no-permission: "<red>You do not have permission to use this command.</red>"
not-ready: "<yellow>EchoClaims is still initializing. Please try again in a moment.</yellow>"
usage: "<white>Usage: /echoclaims <status|incidents <player>|incident <id>|snapshot <id>></white>"
unknown-subcommand: "<red>Unknown subcommand. Use /echoclaims for help.</red>"

status-header: "<aqua>EchoClaims status</aqua>"
status-line: "<gray>{key}:</gray> <white>{value}</white>"

incidents-header: "<aqua>Recent incidents for {player}</aqua>"
incidents-empty: "<yellow>No incidents found for {player}.</yellow>"
incidents-entry: "<gray>#{index}</gray> <white>{type}</white> <gray>at</gray> <white>{time}</white> <gray>id=</gray><yellow>{id}</yellow>"
incidents-count: "<gray>Showing {count} of max {max} incident(s).</gray>"

incident-header: "<aqua>Incident {id}</aqua>"
incident-not-found: "<red>No incident found with id {id}.</red>"
incident-type: "<gray>Type:</gray> <white>{type}</white>"
incident-player: "<gray>Player:</gray> <white>{player}</white>"
incident-occurred: "<gray>Occurred:</gray> <white>{time}</white>"
incident-world: "<gray>World:</gray> <white>{world}</white>"
incident-coords: "<gray>Coordinates:</gray> <white>{x}, {y}, {z}</white>"
incident-cause: "<gray>Cause:</gray> <white>{cause}</white>"
incident-killer: "<gray>Killer:</gray> <white>{killer}</white>"
incident-status: "<gray>Status:</gray> <white>{status}</white>"
incident-pre-snapshot: "<gray>Pre-event snapshot:</gray> <yellow>{id}</yellow>"
incident-post-snapshot: "<gray>Post-event snapshot:</gray> <yellow>{id}</yellow>"
incident-no-post-snapshot: "<gray>Post-event snapshot:</gray> <white>none</white>"
incident-metadata: "<gray>Metadata:</gray> <white>{metadata}</white>"

snapshot-header: "<aqua>Snapshot {id}</aqua>"
snapshot-not-found: "<red>No snapshot found with id {id}.</red>"
snapshot-player: "<gray>Player:</gray> <white>{player}</white>"
snapshot-reason: "<gray>Capture reason:</gray> <white>{reason}</white>"
snapshot-captured: "<gray>Captured:</gray> <white>{time}</white>"
snapshot-world: "<gray>World:</gray> <white>{world}</white>"
snapshot-coords: "<gray>Coordinates:</gray> <white>{x}, {y}, {z}</white>"
snapshot-gamemode: "<gray>Game mode:</gray> <white>{gamemode}</white>"
snapshot-health: "<gray>Health:</gray> <white>{health}</white>"
snapshot-food: "<gray>Food:</gray> <white>{food}</white>"
snapshot-xp: "<gray>XP level:</gray> <white>{level}</white> <gray>(total: {total})</white>"
snapshot-items-header: "<gray>Items ({count}):</gray>"
snapshot-item-entry: "<gray>  [{slot}]</gray> <white>{material}</white> <gray>x{amount}</gray> <yellow>(score {score})</yellow>"
snapshot-no-items: "<gray>No items in snapshot.</gray>"

invalid-uuid: "<red>Invalid UUID: {input}</red>"
invalid-player: "<red>Player not found or invalid UUID: {input}</red>"
db-error: "<red>A database error occurred while querying evidence.</red>"

claim-usage: "<white>Usage: /echoclaims claim <list|view <ref>|create <incident-id-or-index> [description]|cancel <ref>|submit <ref>|claimable|staff-view <ref>|staff-list <player>></white>"
claim-unknown-subcommand: "<red>Unknown claim subcommand. Use /echoclaims claim for help.</red>"
claim-player-only: "<red>This command can only be used by players.</red>"
claim-disabled: "<red>The claim system is currently disabled.</red>"
claim-not-found: "<red>No claim found with reference {reference}.</red>"
claim-not-eligible: "<red>Claim not eligible: {reason}</red>"
claim-duplicate-open: "<red>An open claim already exists for this incident. Reference: {reference}</red>"
claim-rate-limited: "<red>Please wait {seconds}s before creating another claim.</red>"
claim-created: "<green>Claim created successfully. Reference: <yellow>{reference}</yellow></green>"
claim-submitted-success: "<green>Claim {reference} has been submitted for review.</green>"
claim-cancelled-success: "<green>Claim {reference} has been cancelled.</green>"
claim-concurrency-conflict: "<red>Claim {reference} was modified by another action. Please try again.</red>"
claim-transition-rejected: "<red>Claim {reference} transition rejected: {reason}</red>"
claim-list-header: "<aqua>Your claims</aqua>"
claim-list-empty: "<yellow>You have no claims.</yellow>"
claim-list-entry: "<gray>#{index}</gray> <white>{reference}</white> <gray>[{status}]</gray> <gray>at</gray> <white>{time}</white>"
claim-list-count: "<gray>Showing {count} of max {max} claim(s).</gray>"
claim-detail-header: "<aqua>Claim {reference}</aqua>"
claim-id: "<gray>ID:</gray> <white>{value}</white>"
claim-status: "<gray>Status:</gray> <white>{value}</white>"
claim-incident: "<gray>Incident:</gray> <white>{value}</white>"
claim-created-at: "<gray>Created:</gray> <white>{value}</white>"
claim-submitted: "<gray>Submitted:</gray> <white>{value}</white>"
claim-cancelled: "<gray>Cancelled:</gray> <white>{value}</white>"
claim-description: "<gray>Description:</gray> <white>{value}</white>"
claim-version: "<gray>Version:</gray> <white>{value}</white>"
claim-audit-header: "<gray>Audit history ({count}):</gray>"
claim-audit-entry: "<gray>  {action} by {actor} at {time} (v{version})</gray>"
claim-staff-list-header: "<aqua>Claims for {player}</aqua>"
claim-staff-list-empty: "<yellow>No claims found for {player}.</yellow>"
claim-staff-list-entry: "<gray>#{index}</gray> <white>{reference}</white> <gray>[{status}]</gray> <gray>at</gray> <white>{time}</white>"
claim-incident-not-found: "<red>No incident found for input '{input}'. Run /echoclaims claim claimable first, then use the displayed index.</red>"
claim-selection-expired: "<red>Your incident selection has expired. Run /echoclaims claim claimable again to refresh the list.</red>"
claim-claimable-header: "<aqua>Claimable incidents</aqua>"
claim-claimable-empty: "<yellow>You have no claimable incidents.</yellow>"
claim-claimable-entry: "<gray>#{index}</gray> <white>{type}</white> <gray>at</gray> <white>{time}</white> <gray>cause:</gray> <white>{cause}</white>"
claim-claimable-footer: "<gray>Use /echoclaims claim create <index> [description] to create a claim. The index is valid for {ttl} seconds.</gray>"

