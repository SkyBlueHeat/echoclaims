review-note-added: "<green>Internal note added to review for claim {reference}.</green>"
review-note-failed: "<red>Could not add note: {reason}</red>"
review-info-requested: "<green>Information request sent to claimant for claim {reference}.</green>"
review-info-failed: "<red>Could not request information: {reason}</red>"
review-evidence-header: "<aqua>Evidence for claim {reference}</aqua>"
review-evidence-entry: "<gray>#{index}</gray> <white>{state}</white> <gray>slot={slot}</gray> <white>{material}</white> <gray>x{before}→x{after}</gray>"
review-evidence-empty: "<yellow>No evidence items to compare.</yellow>"
review-evidence-footer: "<gray>Use the index with /echoclaims review item. Indices are valid for {ttl} seconds.</gray>"
review-evidence-session-expired: "<red>Your evidence selection has expired. Run /echoclaims review evidence again.</red>"
