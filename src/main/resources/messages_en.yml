# EchoClaims English messages. MiniMessage formatting is supported.
# Placeholders are written as {name} and are sanitized before substitution.

prefix: "<gray>[<aqua>EchoClaims</aqua>]</gray> "

no-permission: "<red>You do not have permission to use this command.</red>"
not-ready: "<yellow>EchoClaims is still initializing. Please try again in a moment.</yellow>"
usage: "<white>Usage: /echoclaims <status|incidents <player>|incident <id>|snapshot <id>></white>"
unknown-subcommand: "<red>Unknown subcommand. Use /echoclaims for help.</red>"

status-header: "<aqua>EchoClaims status</aqua>"
status-line: "<gray>{key}:</gray> <white>{value}</white>"

incidents-header: "<aqua>Recent incidents for {player}</aqua>"
incidents-empty: "<yellow>No incidents found for {player}.</yellow>"
incidents-entry: "<gray>#{index}</gray> <white>{type}</white> <gray>at</gray> <white>{time}</white> <gray>id=</gray><yellow>{id}</yellow>"
incidents-count: "<gray>Showing {count} of max {max} incident(s).</gray>"

incident-header: "<aqua>Incident {id}</aqua>"
incident-not-found: "<red>No incident found with id {id}.</red>"
incident-type: "<gray>Type:</gray> <white>{type}</white>"
incident-player: "<gray>Player:</gray> <white>{player}</white>"
incident-occurred: "<gray>Occurred:</gray> <white>{time}</white>"
incident-world: "<gray>World:</gray> <white>{world}</white>"
incident-coords: "<gray>Coordinates:</gray> <white>{x}, {y}, {z}</white>"
incident-cause: "<gray>Cause:</gray> <white>{cause}</white>"
incident-killer: "<gray>Killer:</gray> <white>{killer}</white>"
incident-status: "<gray>Status:</gray> <white>{status}</white>"
incident-pre-snapshot: "<gray>Pre-event snapshot:</gray> <yellow>{id}</yellow>"
incident-post-snapshot: "<gray>Post-event snapshot:</gray> <yellow>{id}</yellow>"
incident-no-post-snapshot: "<gray>Post-event snapshot:</gray> <white>none</white>"
incident-metadata: "<gray>Metadata:</gray> <white>{metadata}</white>"

snapshot-header: "<aqua>Snapshot {id}</aqua>"
snapshot-not-found: "<red>No snapshot found with id {id}.</red>"
snapshot-player: "<gray>Player:</gray> <white>{player}</white>"
snapshot-reason: "<gray>Capture reason:</gray> <white>{reason}</white>"
snapshot-captured: "<gray>Captured:</gray> <white>{time}</white>"
snapshot-world: "<gray>World:</gray> <white>{world}</white>"
snapshot-coords: "<gray>Coordinates:</gray> <white>{x}, {y}, {z}</white>"
snapshot-gamemode: "<gray>Game mode:</gray> <white>{gamemode}</white>"
snapshot-health: "<gray>Health:</gray> <white>{health}</white>"
snapshot-food: "<gray>Food:</gray> <white>{food}</white>"
snapshot-xp: "<gray>XP level:</gray> <white>{level}</white> <gray>(total: {total})</white>"
snapshot-items-header: "<gray>Items ({count}):</gray>"
snapshot-item-entry: "<gray>  [{slot}]</gray> <white>{material}</white> <gray>x{amount}</gray> <yellow>(score {score})</yellow>"
snapshot-no-items: "<gray>No items in snapshot.</gray>"

invalid-uuid: "<red>Invalid UUID: {input}</red>"
invalid-player: "<red>Player not found or invalid UUID: {input}</red>"
db-error: "<red>A database error occurred while querying evidence.</red>"

