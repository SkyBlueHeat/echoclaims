# EchoClaims - Lost-item claim resolution engine
# Every value is validated on load. An invalid value is replaced by the default below and
# reported in the server log, so a typo can never prevent the plugin from starting.

# Message language: en or tr.
locale: en

# MiniMessage prefix prepended to every player-facing message.
message-prefix: "<gray>[<aqua>EchoClaims</aqua>]</gray> "

# Enable verbose debug logging.
debug: false

# Deterministic item value scoring. Scores are integers; higher means more claim-worthy.
scoring:
  # Exact material keys win over material-tiers.
  material-scores:
    dragon_egg: 100
    enchanted_golden_apple: 60
    elytra: 55
    nether_star: 55
    trident: 50
    mace: 50
    totem_of_undying: 45
  # Material path prefixes, longest match wins.
  material-tiers:
    netherite_: 60
    diamond_: 45
    golden_: 25
    iron_: 20
    chainmail_: 15
    stone_: 8
    wooden_: 4
    leather_: 4
  default-material-score: 1
  # Points per enchantment plus points per enchantment level.
  enchantment-base: 4
  enchantment-per-level: 2
  custom-name-bonus: 8
  unbreakable-bonus: 12
  # Applied when a non-vanilla provider identified the item.
  provider-identified-bonus: 10
  # Maximum bonus from stack size.
  amount-bonus-cap: 5
  # Maximum penalty from durability damage.
  wear-penalty-cap: 10

persistence:
  # SQLite file inside the plugin data folder.
  sqlite-file: echoclaims.db
  # How long onDisable waits for the writer thread to flush.
  shutdown-timeout-seconds: 10
  # Maximum queued records before new ones are dropped and logged.
  write-queue-capacity: 2000
  # Records written per transaction.
  write-batch-size: 64

evidence:
  capture:
    # Capture inventory snapshots on player death.
    player-death: true
    # Capture a post-respawn snapshot after PlayerRespawnEvent.
    post-respawn: true
  # Maximum number of results returned by evidence lookup commands.
  max-recent-results: 10
  # Maximum serialized item payload size in bytes (before Base64 encoding).
  max-item-payload-bytes: 65536
  # Maximum queued evidence capture tasks before new ones are rejected.
  queue-capacity: 256

claims:
  # Enable or disable the claim system entirely.
  enabled: true
  # Cooldown in seconds between claim creations per player. Set to 0 to disable.
  rate-limit-cooldown-seconds: 30
  # Maximum length of the player-provided claim description.
  max-description-length: 256
  # Time-to-live in seconds for the incident selection session created by /ec claim claimable.
  # The session binds displayed indices to exact incident UUIDs so an index never
  # silently resolves to a different incident.
  selection-session-ttl-seconds: 120
  # Maximum number of players tracked simultaneously in selection sessions.
  selection-session-max-players: 100

reviews:
  # Enable or disable the staff review system entirely.
  enabled: true
  # Time-to-live in seconds for the evidence selection session created by /ec review evidence.
  # The session binds displayed indices to exact evidence item references so an index never
  # silently resolves to a different item.
  evidence-session-ttl-seconds: 300
  # Maximum number of staff members tracked simultaneously in evidence selection sessions.
  evidence-session-max-staff: 50
  # Maximum number of claims returned per page in the review queue.
  queue-page-size: 20
  # Maximum character length for internal staff notes.
  max-internal-note-length: 1000
  # Maximum character length for information requests sent to players.
  max-question-length: 1000
  # Maximum character length for player responses.
  max-player-response-length: 1000
  # Maximum character length for final review summaries.
  max-final-summary-length: 2000
  # Maximum character length for item decision staff notes.
  max-item-note-length: 500
  # Maximum number of item decisions allowed per claim review.
  max-item-decisions-per-claim: 100
  # Maximum number of active (OPEN) reviews a single staff member can be assigned to.
  # Set to 0 to disable the limit.
  max-active-reviews-per-staff: 5
  # Cooldown in seconds between player responses on the same claim. Set to 0 to disable.
  player-response-cooldown-seconds: 0
  # When true, only the assigned reviewer can add notes, request information,
  # create/update item decisions, and finalize the review.
  require-assignment-for-mutations: true
  # When false, players cannot cancel a claim once it is UNDER_REVIEW or WAITING_FOR_PLAYER.
  allow-player-cancel-after-review-start: false

refunds:
  # Enable or disable the refund system entirely.
  enabled: true
  # Allow players to claim their own refunds via /ec refund claim <ref>.
  player-self-claim: true
  # Automatically deliver pending refunds when the player logs in.
  # Requires the player to be online; offline players are skipped.
  auto-deliver-on-login: false
  # Maximum number of refund items processed in a single delivery execution.
  # Higher values mean more items per transaction but longer delivery time.
  max-items-per-execution: 100
  # Allow staff to retry failed refunds via /ec refund retry <ref>.
  retry-failed-refunds: true
