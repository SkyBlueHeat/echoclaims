# EchoClaims Türkçe mesajları. MiniMessage biçimlendirmesi desteklenir.
# Yer tutucular {ad} biçimindedir ve yerleştirilmeden önce temizlenir.

prefix: "<gray>[<aqua>EchoClaims</aqua>]</gray> "

no-permission: "<red>Bu komutu kullanma yetkiniz yok.</red>"
not-ready: "<yellow>EchoClaims hâlâ başlatılıyor. Lütfen birazdan tekrar deneyin.</yellow>"
usage: "<white>Kullanım: /echoclaims <status|incidents <oyuncu>|incident <id>|snapshot <id>></white>"
unknown-subcommand: "<red>Bilinmeyen alt komut. Yardım için /echoclaims yazın.</red>"

status-header: "<aqua>EchoClaims durumu</aqua>"
status-line: "<gray>{key}:</gray> <white>{value}</white>"

incidents-header: "<aqua>{player} için son olaylar</aqua>"
incidents-empty: "<yellow>{player} için olay bulunamadı.</yellow>"
incidents-entry: "<gray>#{index}</gray> <white>{type}</white> <gray>—</gray> <white>{time}</white> <gray>id=</gray><yellow>{id}</yellow>"
incidents-count: "<gray>En fazla {max} olaydan {count} tanesi gösteriliyor.</gray>"

incident-header: "<aqua>Olay {id}</aqua>"
incident-not-found: "<red>{id} kimlikli olay bulunamadı.</red>"
incident-type: "<gray>Tür:</gray> <white>{type}</white>"
incident-player: "<gray>Oyuncu:</gray> <white>{player}</white>"
incident-occurred: "<gray>Zaman:</gray> <white>{time}</white>"
incident-world: "<gray>Dünya:</gray> <white>{world}</white>"
incident-coords: "<gray>Koordinatlar:</gray> <white>{x}, {y}, {z}</white>"
incident-cause: "<gray>Neden:</gray> <white>{cause}</white>"
incident-killer: "<gray>Öldüren:</gray> <white>{killer}</white>"
incident-status: "<gray>Durum:</gray> <white>{status}</white>"
incident-pre-snapshot: "<gray>Olay öncesi anlık görüntü:</gray> <yellow>{id}</yellow>"
incident-post-snapshot: "<gray>Olay sonrası anlık görüntü:</gray> <yellow>{id}</yellow>"
incident-no-post-snapshot: "<gray>Olay sonrası anlık görüntü:</gray> <white>yok</white>"
incident-metadata: "<gray>Üst veri:</gray> <white>{metadata}</white>"

snapshot-header: "<aqua>Anlık görüntü {id}</aqua>"
snapshot-not-found: "<red>{id} kimlikli anlık görüntü bulunamadı.</red>"
snapshot-player: "<gray>Oyuncu:</gray> <white>{player}</white>"
snapshot-reason: "<gray>Neden:</gray> <white>{reason}</white>"
snapshot-captured: "<gray>Zaman:</gray> <white>{time}</white>"
snapshot-world: "<gray>Dünya:</gray> <white>{world}</white>"
snapshot-coords: "<gray>Koordinatlar:</gray> <white>{x}, {y}, {z}</white>"
snapshot-gamemode: "<gray>Oyun modu:</gray> <white>{gamemode}</white>"
snapshot-health: "<gray>Sağlık:</gray> <white>{health}</white>"
snapshot-food: "<gray>Açlık:</gray> <white>{food}</white>"
snapshot-xp: "<gray>XP seviyesi:</gray> <white>{level}</white> <gray>(toplam: {total})</gray>"
snapshot-items-header: "<gray>Eşyalar ({count}):</gray>"
snapshot-item-entry: "<gray>  [{slot}]</gray> <white>{material}</white> <gray>x{amount}</gray> <yellow>(puan {score})</yellow>"
snapshot-no-items: "<gray>Anlık görüntüde eşya yok.</gray>"

invalid-uuid: "<red>Geçersiz UUID: {input}</red>"
invalid-player: "<red>Oyuncu bulunamadı veya geçersiz UUID: {input}</red>"
db-error: "<red>Kanıt sorgulanırken veritabanı hatası oluştu.</red>"
