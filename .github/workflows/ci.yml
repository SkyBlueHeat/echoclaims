name: CI

on:
  pull_request:
  push:
    branches: [main, devin/echoclaims-mvp-02-claims]

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false"

jobs:
  build-and-test:
    name: Build, Test, Integration, Runtime Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk25-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk25-

      - name: Validate Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Clean test shadowJar
        run: ./gradlew clean test shadowJar --rerun-tasks

      - name: Paper integration test
        run: ./gradlew paperIntegrationTest --rerun-tasks --no-configuration-cache

      - name: Runtime validation
        run: ./gradlew runtimeValidation --rerun-tasks --no-configuration-cache

      - name: Production JAR inspection
        run: |
          set -e
          JAR="build/libs/echoclaims-0.1.0-SNAPSHOT.jar"
          if [ ! -f "$JAR" ]; then
            echo "FAIL: Production JAR not found at $JAR"
            exit 1
          fi
          echo "JAR path: $JAR"
          echo "JAR size: $(stat -c%s "$JAR") bytes"
          ENTRY_COUNT=$(jar tf "$JAR" | wc -l)
          echo "Entry count: $ENTRY_COUNT"

          check_zero() {
            local pattern="$1"
            local label="$2"
            local count
            count=$(jar tf "$JAR" | grep -c "$pattern" || true)
            if [ "$count" -ne 0 ]; then
              echo "FAIL: Found $count entries matching '$label' (pattern: $pattern)"
              jar tf "$JAR" | grep "$pattern" | head -20
              exit 1
            fi
            echo "PASS: zero matches for $label"
          }

          check_zero "org/geysermc" "org/geysermc"
          check_zero "io/netty" "io/netty validation-only classes"
          check_zero "HeadlessBotClient" "HeadlessBotClient"
          check_zero "RuntimeValidationPlugin" "RuntimeValidationPlugin"
          check_zero "Test" "test classes"
          check_zero "\.db$" "databases"
          check_zero "\.log$" "logs"
          check_zero "world" "generated worlds"
          check_zero "validation-results" "validation result files"
          check_zero "C:" "local Windows paths"
          check_zero "/home/" "local Unix paths"
          check_zero "/tmp/" "local Unix tmp paths"
          check_zero "WorldEcho" "WorldEcho runtime identifiers"

          PLUGIN_YML_COUNT=$(jar tf "$JAR" | grep -c "plugin\.yml" || true)
          if [ "$PLUGIN_YML_COUNT" -ne 1 ]; then
            echo "FAIL: Expected exactly 1 plugin.yml, found $PLUGIN_YML_COUNT"
            exit 1
          fi
          echo "PASS: exactly 1 plugin.yml"

          SQLITE_COUNT=$(jar tf "$JAR" | grep -c "org/sqlite" || true)
          echo "Shaded sqlite-jdbc entries: $SQLITE_COUNT"

          echo "Production JAR inspection: ALL CHECKS PASSED"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/paperServer/results.txt
            build/runtimeServer/validation-results.txt
          retention-days: 7
